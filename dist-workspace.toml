# cargo-dist (distributed as the `dist` binary) config.
#
# This file is the ONLY place dist reads its settings from — a
# `[package.metadata.dist]` table in Cargo.toml is silently ignored for
# the keys below, so don't reintroduce one.
#
# After editing, regenerate the release workflow:
#
#     dist init --yes        # or: dist generate
#
# and commit the resulting `.github/workflows/release.yml`. See
# CONTRIBUTING.md § "Releasing (maintainers only)" for the full flow.

[workspace]
members = ["cargo:."]

[dist]
# Pinned so CI uses the same dist as the maintainer ran locally. Bump
# this and re-run `dist init --yes` in the same commit.
cargo-dist-version = "0.32.0"

# CI backends to support.
ci = "github"

# One-line curl|sh and irm|iex installers, published as release assets
# alongside the archives.
installers = ["shell", "powershell"]

# Target platforms to build for (Rust target-triple syntax).
# musl variants are deliberately absent for now — they need a
# cross-compilation toolchain in the runner; tracked as a follow-up in
# PLAN.md section 7.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Run `dist plan` (dry-run) on PRs so release-pipeline regressions
# surface before they bite a tag.
pr-run-mode = "plan"

# Emit a .sha256 next to every artifact for users who want to verify.
checksum = "sha256"
