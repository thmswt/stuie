[package]
name = "stuie"
version = "0.1.0"
edition = "2024"
authors = ["Thomas Weit <me@thomas-weit.de>"]
description = "Storage Terminal UI Explorer — interactive TUI for browsing AWS S3, MinIO, and Google Cloud Storage from the terminal."
license = "MIT"
readme = "README.md"
repository = "https://github.com/thmswt/stuie"
homepage = "https://github.com/thmswt/stuie"
documentation = "https://github.com/thmswt/stuie#readme"
keywords = ["s3", "gcs", "tui", "object-storage", "ratatui"]
categories = ["command-line-utilities", "filesystem"]

[lints.clippy]
# Default-warn group is denied repo-wide; specific lints we don't want
# to enforce are allow-listed below with a reason.
all = { level = "deny", priority = -1 }

# `collapsible_if`'s suggested fix uses let-chains (`if let X = y && z`).
# Style choice: keep nested `if let` blocks.
collapsible_if = "allow"

# Fires on the `#[async_trait]` expansion of `StorageBackend` with newer
# clippy (the diagnostic originates in the macro, not in our code).
double_must_use = "allow"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
crossterm = "0.29.0"
dirs = "6.0.0"
object_store = { version = "0.13.1", features = ["aws", "gcp", "http"] }
ratatui = "0.30.0"
ratatui-explorer = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
async-trait = "0.1.86"
aws-config = "1.5.15"
aws-sdk-s3 = "1.74.0"
bytes = "1.10.0"
futures = "0.3.31"
tokio-util = { version = "0.7.13", features = ["io"] }
arboard = "3.6.1"
devicons = "0.6"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
jsonwebtoken = "9"
