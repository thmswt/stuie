[package]
name = "stuie"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
crossterm = "0.29.0"
dirs = "6.0.0"
object_store = { version = "0.13.1", features = ["aws", "http"] }
ratatui = "0.30.0"
ratatui-explorer = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
async-trait = "0.1.86"
aws-config = "1.5.15"
aws-sdk-s3 = "1.74.0"
bytes = "1.10.0"
futures = "0.3.31"
tokio-util = { version = "0.7.13", features = ["io"] }
arboard = "3.6.1"
devicons = "0.6"
